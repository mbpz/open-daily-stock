[project]
name = "open-daily-stock"
version = "0.4.0"
description = "Local-first A-share/HK/US stock analyzer with AI, TUI+GUI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["textual>=0.1.0"]

[project.scripts]
open-daily-stock = "main:main"

[project.urls]
Homepage = "https://github.com/mbpz/open-daily-stock"
Repository = "https://github.com/mbpz/open-daily-stock"

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | _build
    | buck-out
    | build
    | dist
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = [".git", "__pycache__", ".env", "venv", ".venv"]

[tool.bandit]
exclude_dirs = ["tests", "test_*.py"]
skips = ["B101"]  # assert 语句在测试中是允许的
