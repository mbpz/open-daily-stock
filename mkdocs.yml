site_name: Open Daily Stock
site_description: A-share / HK-stock / US-stock intelligent analysis system
site_url: https://mbpz.github.io/open-daily-stock/
site_author: mbpz

repo_name: mbpz/open-daily-stock
repo_url: https://github.com/mbpz/open-daily-stock

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight

nav:
  - Home: en/index.md
  - 中文: zh/index.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mbpz/open-daily-stock
