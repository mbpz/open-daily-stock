name: Build TUI Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install build deps
        run: pip install pyinstaller textual flet>=0.25.0

      - name: Build executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pyinstaller --onefile --console --name open-daily-stock --additional-hooks-dir .github/pyinstaller-hooks main.py
        env:
          GITHUB_ACTIONS: true

      - name: Build executable (macOS)
        if: matrix.os == 'macos-latest'
        run: pyinstaller --onefile --console --name open-daily-stock-macos --additional-hooks-dir .github/pyinstaller-hooks main.py
        env:
          GITHUB_ACTIONS: true

      - name: Build executable (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller --onefile --console --name open-daily-stock.exe --additional-hooks-dir .github/pyinstaller-hooks main.py
        env:
          GITHUB_ACTIONS: true

      - name: Build GUI executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pyinstaller gui/open-daily-stock.spec

      - name: Build GUI executable (macOS)
        if: matrix.os == 'macos-latest'
        run: pyinstaller gui/open-daily-stock.spec

      - name: Build GUI executable (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller gui/open-daily-stock.spec

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-daily-stock-${{ matrix.os }}
          path: dist/open-daily-stock*
          retention-days: 30

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute SHA256 checksums
        run: |
          echo "## SHA256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find artifacts -type f | sort | while read f; do
            if file "$f" | grep -q "ELF\|Mach-O\|PE32"; then
              SHA=$(sha256sum "$f" | awk '{print $1}')
              echo "$SHA  $(basename "$f")"
              echo "$SHA  $(basename "$f")" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Export SHA256 to env summary (Homebrew)
        run: |
          echo "## :beer: Homebrew Formula SHA256" >> $GITHUB_STEP_SUMMARY
          echo "Update \`scripts/homebrew/open-daily-stock.rb\` with:" >> $GITHUB_STEP_SUMMARY
          echo '```ruby' >> $GITHUB_STEP_SUMMARY
          MACOS_SHA=$(sha256sum artifacts/open-daily-stock-macos-latest/open-daily-stock-macos 2>/dev/null | awk '{print $1}' || echo "PLACEHOLDER")
          echo "sha256 \"$MACOS_SHA\"" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Export SHA256 to env summary (winget)
        run: |
          echo "## :window: winget Manifest SHA256" >> $GITHUB_STEP_SUMMARY
          echo "Update \`scripts/winget/mbpz.open-daily-stock.yaml\` with:" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          WIN_SHA=$(sha256sum artifacts/open-daily-stock-windows-latest/open-daily-stock.exe 2>/dev/null | awk '{print $1}' || echo "PLACEHOLDER")
          echo "InstallerSha256: $WIN_SHA" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  release:
    needs: [build, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
