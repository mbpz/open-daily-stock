<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Daily Stock - Redirecting...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            color: white;
            padding: 2rem;
        }
        h1 { font-size: 2rem; margin-bottom: 1rem; }
        p { opacity: 0.9; margin-bottom: 1.5rem; }
        .links { display: flex; gap: 1rem; justify-content: center; }
        a {
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border: 2px solid white;
            border-radius: 8px;
            transition: all 0.3s;
        }
        a:hover { background: white; color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Open Daily Stock</h1>
        <p>A-share / HK-stock / US-stock intelligent analysis system</p>
        <div class="links">
            <a href="zh/">中文</a>
            <a href="en/">English</a>
        </div>
    </div>
    <script>
        (function() {
            var lang = navigator.language || navigator.userLanguage || 'en';
            var langCode = lang.toLowerCase().substring(0, 2);
            if (langCode === 'zh') {
                window.location.href = 'zh/';
            } else {
                window.location.href = 'en/';
            }
        })();
    </script>
</body>
</html>
